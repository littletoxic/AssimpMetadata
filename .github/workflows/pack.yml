name: Pack

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  pack:
    name: Pack NuGet package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Install Doxygen
        run: choco install doxygen.install -y --no-progress

      - name: Install WinMD generator dependency
        shell: pwsh
        run: |
          dotnet tool install --global ClangSharpPInvokeGenerator --version 17.0.1
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $project = [xml](Get-Content -Raw nuget\LittleToxic.AssimpMetadata.proj)
          $packageVersion = $project.Project.PropertyGroup.Version
          if ($packageVersion -is [array]) {
            $packageVersion = $packageVersion[0]
          }

          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version '$tagVersion' does not match package version '$packageVersion'."
          }

      - name: Pack
        shell: pwsh
        run: ./pack.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: packages/*.nupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to NuGet
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package
        run: dotnet nuget push packages/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
